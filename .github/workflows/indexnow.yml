name: Submit sitemap to IndexNow

# Manual only - trigger from the Actions tab (e.g. weekly) rather than on
# every push. IndexNow's own backend was rejecting the key verification
# (UserForbiddedToAccessSite) independent of anything in this repo, so
# running it on every push just produced a red X on every commit.
on:
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_HOST: powergrabtx.com
          INDEXNOW_KEY: fef7947ae718cfa033884a1c39aa80b1
          SITEMAP_URL: https://powergrabtx.com/sitemap-index.xml
        run: node scripts/submit-indexnow.mjs
