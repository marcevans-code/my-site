name: Submit sitemap to IndexNow

# Runs whenever you push to main — the same push that triggers your
# Cloudflare Pages deploy. Submitting the URL list doesn't require the
# new pages to be live yet; the engines simply queue them for a re-crawl.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_HOST: powergrabtx.com
          INDEXNOW_KEY: fef7947ae718cfa033884a1c39aa80b1
          SITEMAP_URL: https://powergrabtx.com/sitemap-index.xml
        run: node scripts/submit-indexnow.mjs
